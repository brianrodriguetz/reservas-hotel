<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel - Reservas</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
  <style>
    .eventos { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .ev-check_in    { background:rgba(40,130,90,.15);  color:var(--color-exito);   padding:3px 8px; border-radius:4px; font-size:10pt; font-weight:bold; }
    .ev-check_out   { background:rgba(33,64,95,.15);   color:var(--color-primario); padding:3px 8px; border-radius:4px; font-size:10pt; font-weight:bold; }
    .ev-cancelacion { background:rgba(176,47,47,.15);  color:var(--color-peligro); padding:3px 8px; border-radius:4px; font-size:10pt; font-weight:bold; }
    .panel-detalle { margin-top: 22px; }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-titulo">HOTEL</div><div class="logo-subtitulo">Diablos Rojos</div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item">Inicio</a>
      <a href="clientes.html" class="menu-item">Clientes</a>
      <a href="reservas.html" class="menu-item">Reservas</a>
      <a href="habitaciones.html" class="menu-item">Habitaciones</a>
      <a href="pagos.html" class="menu-item">Pagos</a>
      <div id="menu-separador" class="separador"></div>
      <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
      <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
    </nav>
    <div class="sidebar-footer"><button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button></div>
  </aside>

  <div class="contenido-principal">
    <header class="topbar">
      <div class="info-usuario">
        <span id="topbar-nombre" class="saludo"></span>
        <span class="separador-texto">·</span>
        <span id="topbar-rol" class="rol"></span>
      </div>
      <div id="topbar-avatar" class="avatar"></div>
    </header>

    <main class="contenido">
      <div class="page-header">
        <h1 class="titulo">Gestion de Reservas</h1>
        <p class="subtitulo">Consultar, registrar eventos y cancelar reservas</p>
      </div>

      <div id="contenedor-mensaje" class="mensaje oculto"></div>

      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th><th>Cliente</th><th>Habitacion</th>
            <th>Check-In Previsto</th><th>Check-Out Previsto</th>
            <th>Noches</th><th>Canal</th><th>Estado</th><th>Total</th><th>Acciones</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <!-- Detalle de eventos de la reserva seleccionada -->
      <div id="panel-eventos" class="tarjeta panel-detalle" style="display:none">
        <h3 class="tarjeta-titulo">Eventos de la reserva <span id="ev-id"></span></h3>
        <div id="lista-eventos"></div>
        <div class="acciones" style="margin-top:14px">
          <button class="btn btn-exito" style="background:var(--color-exito);color:white" onclick="registrarEvento('CHECK_IN')">Registrar Check-In</button>
          <button class="btn btn-secundario" onclick="registrarEvento('CHECK_OUT')">Registrar Check-Out</button>
          <button class="btn btn-peligro" onclick="cancelarReserva()">Cancelar Reserva</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="../js/datos.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/comunes.js"></script>
<script>
  inicializarLayout();
  let selReserva = null;

  function claseEstado(e) {
    if (e === 'Confirmada') return 'badge badge-primario';
    if (e === 'Pendiente')  return 'badge badge-acento';
    if (e === 'En Curso')   return 'badge badge-exito';
    if (e === 'Cancelada' || e === 'No Show') return 'badge badge-peligro';
    return 'badge';
  }

  function cargarTabla() {
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    RESERVAS.forEach(function(r) {
      const puedeCancelar = r.estado !== 'Cancelada' && r.estado !== 'Finalizada';
      const tr = document.createElement('tr');
      tr.onclick = function() { verEventos(r, tr); };
      tr.innerHTML =
        '<td>' + r.idReserva + '</td>' +
        '<td>' + r.nombreCliente + '</td>' +
        '<td>' + r.codigoHabitacion + '</td>' +
        '<td>' + r.fechaCheckInPrevista + '</td>' +
        '<td>' + r.fechaCheckOutPrevista + '</td>' +
        '<td>' + r.numeroNoches + '</td>' +
        '<td>' + r.canal + '</td>' +
        '<td><span class="' + claseEstado(r.estado) + '">' + r.estado + '</span></td>' +
        '<td>' + formatearMoneda(r.precioTotal) + '</td>' +
        '<td>' + (puedeCancelar ? '<button class="btn btn-peligro btn-mini" onclick="event.stopPropagation();cancelar(' + r.idReserva + ')">Cancelar</button>' : '—') + '</td>';
      tb.appendChild(tr);
    });
  }

  function verEventos(r, tr) {
    selReserva = r;
    document.querySelectorAll('#tbody tr').forEach(function(x) { x.classList.remove('seleccionada'); });
    tr.classList.add('seleccionada');
    document.getElementById('panel-eventos').style.display = '';
    document.getElementById('ev-id').textContent = '#' + r.idReserva;
    const lista = document.getElementById('lista-eventos');
    if (!r.eventos || !r.eventos.length) {
      lista.innerHTML = '<p style="color:var(--color-texto-suave)">Sin eventos registrados</p>';
      return;
    }
    lista.innerHTML = r.eventos.map(function(ev) {
      return '<div class="ev-' + ev.tipo.toLowerCase() + '" style="margin-bottom:6px">' +
             ev.tipo + ' &nbsp;·&nbsp; ' + formatearFechaHora(ev.fechaHora) +
             (ev.motivo ? ' &nbsp;·&nbsp; ' + ev.motivo : '') + '</div>';
    }).join('');
  }

  function registrarEvento(tipo) {
    if (!selReserva) return;
    selReserva.eventos.push({ tipo: tipo, fechaHora: new Date().toISOString(), idEmpleado: obtenerSesion().idEmpleado });
    if (tipo === 'CHECK_IN')  selReserva.estado = 'En Curso';
    if (tipo === 'CHECK_OUT') selReserva.estado = 'Finalizada';
    mostrarMensaje('exito', tipo + ' registrado');
    cargarTabla();
    verEventos(selReserva, document.querySelector('#tbody tr.seleccionada') || document.createElement('tr'));
  }

  function cancelar(id) {
    if (!confirm('Cancelar reserva #' + id + '?')) return;
    const r = RESERVAS.find(function(x) { return x.idReserva === id; });
    if (r) {
      r.estado = 'Cancelada';
      r.eventos.push({ tipo: 'CANCELACION', fechaHora: new Date().toISOString(), motivo: 'Cancelada por operador' });
    }
    mostrarMensaje('exito', 'Reserva cancelada');
    cargarTabla();
  }

  function cancelarReserva() {
    if (selReserva) cancelar(selReserva.idReserva);
  }

  cargarTabla();
</script>
</body>
</html>
