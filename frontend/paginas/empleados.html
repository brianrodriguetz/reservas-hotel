<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel Diablos Rojos - Empleados</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-titulo">HOTEL</div>
        <div class="logo-subtitulo">Diablos Rojos</div>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">Inicio</a>
        <a href="clientes.html" class="menu-item">Clientes</a>
        <a href="reservas.html" class="menu-item">Reservas</a>
        <a href="habitaciones.html" class="menu-item">Habitaciones</a>
        <a href="pagos.html" class="menu-item">Pagos</a>
        <div id="menu-separador" class="separador"></div>
        <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
        <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
      </nav>
      <div class="sidebar-footer">
        <button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button>
      </div>
    </aside>

    <div class="contenido-principal">
      <header class="topbar">
        <div class="info-usuario">
          <span id="topbar-nombre" class="saludo"></span>
          <span class="separador-texto">·</span>
          <span id="topbar-rol" class="rol"></span>
        </div>
        <div id="topbar-avatar" class="avatar"></div>
      </header>

      <main class="contenido">

        <div class="page-header">
          <h1 class="titulo">Gestion de Empleados</h1>
          <p class="subtitulo">Administrar el personal del hotel</p>
        </div>

        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Documento</th>
              <th>Nombre</th>
              <th>Cargo</th>
              <th>Email</th>
              <th>Usuario</th>
              <th>Salario</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tabla-empleados"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/comunes.js"></script>
  <script>
    // Solo admins
    verificarAdmin();
    inicializarLayout();

    const tbody = document.getElementById('tabla-empleados');
    for (let i = 0; i < EMPLEADOS.length; i++) {
      const e = EMPLEADOS[i];
      const claseEstado = e.estado === 'Activo' ? 'badge badge-exito' : 'badge badge-peligro';
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + e.idPersona + '</td>' +
        '<td>' + e.numeroDocumento + '</td>' +
        '<td>' + e.nombre + ' ' + e.apellido + '</td>' +
        '<td><span class="badge badge-primario">' + e.cargo + '</span></td>' +
        '<td>' + e.email + '</td>' +
        '<td>' + e.usuario + '</td>' +
        '<td>' + formatearMoneda(e.salario) + '</td>' +
        '<td><span class="' + claseEstado + '">' + e.estado + '</span></td>';
      tbody.appendChild(tr);
    }
  </script>

</body>
</html>
