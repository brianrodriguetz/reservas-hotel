<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel - Habitaciones</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-titulo">HOTEL</div><div class="logo-subtitulo">Diablos Rojos</div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item">Inicio</a>
      <a href="clientes.html" class="menu-item">Clientes</a>
      <a href="reservas.html" class="menu-item">Reservas</a>
      <a href="habitaciones.html" class="menu-item">Habitaciones</a>
      <a href="pagos.html" class="menu-item">Pagos</a>
      <div id="menu-separador" class="separador"></div>
      <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
      <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
    </nav>
    <div class="sidebar-footer"><button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button></div>
  </aside>

  <div class="contenido-principal">
    <header class="topbar">
      <div class="info-usuario">
        <span id="topbar-nombre" class="saludo"></span>
        <span class="separador-texto">·</span>
        <span id="topbar-rol" class="rol"></span>
      </div>
      <div id="topbar-avatar" class="avatar"></div>
    </header>

    <main class="contenido">
      <div class="page-header">
        <h1 class="titulo">Habitaciones</h1>
        <p class="subtitulo">Catalogo y disponibilidad del hotel</p>
      </div>

      <h3 class="seccion-titulo">Tipos de habitacion</h3>
      <table class="tabla" style="margin-bottom:26px">
        <thead>
          <tr><th>ID Tipo</th><th>Nombre</th><th>Precio base / noche</th><th>Capacidad</th></tr>
        </thead>
        <tbody id="tbody-tipos"></tbody>
      </table>

      <h3 class="seccion-titulo">Habitaciones</h3>
      <table class="tabla">
        <thead>
          <tr><th>ID</th><th>Codigo</th><th>Piso</th><th>Tipo</th><th>Cap. Max.</th><th>Precio base</th><th>Estado</th></tr>
        </thead>
        <tbody id="tbody-hab"></tbody>
      </table>
    </main>
  </div>
</div>

<script src="../js/datos.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/comunes.js"></script>
<script>
  inicializarLayout();

  function claseEstado(e) {
    if (e === 'Disponible') return 'badge badge-exito';
    if (e === 'Ocupada') return 'badge badge-acento';
    if (e === 'En Mantenimiento') return 'badge badge-peligro';
    return 'badge badge-primario';
  }

  const tbTipos = document.getElementById('tbody-tipos');
  TIPOS_HABITACION.forEach(function(t) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + t.idTipo + '</td><td><strong>' + t.nombre + '</strong></td>' +
      '<td>' + formatearMoneda(t.precioBaseNoche) + '</td><td>' + t.numeroInternos + '</td>';
    tbTipos.appendChild(tr);
  });

  const tbHab = document.getElementById('tbody-hab');
  HABITACIONES.forEach(function(h) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + h.idHabitacion + '</td><td><strong>' + h.codigo + '</strong></td>' +
      '<td>' + h.piso + '</td><td>' + h.tipo + '</td><td>' + h.capacidadMax + '</td>' +
      '<td>' + formatearMoneda(h.precioBase) + '</td>' +
      '<td><span class="' + claseEstado(h.estado) + '">' + h.estado + '</span></td>';
    tbHab.appendChild(tr);
  });
</script>
</body>
</html>
