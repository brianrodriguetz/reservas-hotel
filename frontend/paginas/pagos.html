<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel Diablos Rojos - Pagos</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-titulo">HOTEL</div>
        <div class="logo-subtitulo">Diablos Rojos</div>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">Inicio</a>
        <a href="clientes.html" class="menu-item">Clientes</a>
        <a href="reservas.html" class="menu-item">Reservas</a>
        <a href="habitaciones.html" class="menu-item">Habitaciones</a>
        <a href="pagos.html" class="menu-item">Pagos</a>
        <div id="menu-separador" class="separador"></div>
        <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
        <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
      </nav>
      <div class="sidebar-footer">
        <button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button>
      </div>
    </aside>

    <div class="contenido-principal">
      <header class="topbar">
        <div class="info-usuario">
          <span id="topbar-nombre" class="saludo"></span>
          <span class="separador-texto">·</span>
          <span id="topbar-rol" class="rol"></span>
        </div>
        <div id="topbar-avatar" class="avatar"></div>
      </header>

      <main class="contenido">

        <div class="page-header">
          <h1 class="titulo">Gestion de Pagos</h1>
          <p class="subtitulo">Registrar pagos y consultar el historial</p>
        </div>

        <table class="tabla">
          <thead>
            <tr>
              <th>ID Pago</th>
              <th>Fecha</th>
              <th>Reserva</th>
              <th>Cliente</th>
              <th>Monto</th>
              <th>Metodo</th>
              <th>Estado</th>
              <th># Transaccion</th>
            </tr>
          </thead>
          <tbody id="tabla-pagos"></tbody>
        </table>

      </main>
    </div>
  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/comunes.js"></script>
  <script>
    inicializarLayout();

    const tbody = document.getElementById('tabla-pagos');
    for (let i = 0; i < PAGOS.length; i++) {
      const p = PAGOS[i];
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + p.idPago + '</td>' +
        '<td>' + formatearFechaHora(p.fechaPago) + '</td>' +
        '<td>#' + p.idReserva + '</td>' +
        '<td>' + p.nombreCliente + '</td>' +
        '<td><strong>' + formatearMoneda(p.monto) + '</strong></td>' +
        '<td>' + p.metodo + '</td>' +
        '<td><span class="badge badge-exito">' + p.estado + '</span></td>' +
        '<td>' + (p.numeroTransaccion || '—') + '</td>';
      tbody.appendChild(tr);
    }
  </script>

</body>
</html>
