<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel - Clientes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-titulo">HOTEL</div><div class="logo-subtitulo">Diablos Rojos</div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item">Inicio</a>
      <a href="clientes.html" class="menu-item">Clientes</a>
      <a href="reservas.html" class="menu-item">Reservas</a>
      <a href="habitaciones.html" class="menu-item">Habitaciones</a>
      <a href="pagos.html" class="menu-item">Pagos</a>
      <div id="menu-separador" class="separador"></div>
      <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
      <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
    </nav>
    <div class="sidebar-footer"><button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button></div>
  </aside>

  <div class="contenido-principal">
    <header class="topbar">
      <div class="info-usuario">
        <span id="topbar-nombre" class="saludo"></span>
        <span class="separador-texto">·</span>
        <span id="topbar-rol" class="rol"></span>
      </div>
      <div id="topbar-avatar" class="avatar"></div>
    </header>

    <main class="contenido">
      <div class="page-header">
        <h1 class="titulo">Gestion de Clientes</h1>
        <p class="subtitulo">Registrar, actualizar, buscar y eliminar clientes</p>
      </div>

      <div class="tarjeta busqueda">
        <label>Buscar:</label>
        <input id="buscar" type="text" placeholder="Documento, nombre o apellido">
        <button class="btn btn-acento" onclick="buscar()">Buscar</button>
        <button class="btn btn-secundario" onclick="resetear()">Todos</button>
      </div>

      <div id="contenedor-mensaje" class="mensaje oculto"></div>

      <table class="tabla">
        <thead>
          <tr>
            <th>ID</th><th>Tipo Doc.</th><th>Documento</th>
            <th>Nombre</th><th>Apellido</th><th>Email</th>
            <th>Telefono</th><th>Ciudad</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <!-- PERSONA / CLIENTE -->
      <div class="tarjeta formulario">
        <h3 class="tarjeta-titulo">Datos del cliente</h3>
        <form id="form-cliente">

          <p style="font-size:11pt;color:var(--color-texto-suave);margin-bottom:14px">
            Seccion PERSONA
          </p>
          <div class="grid-3">
            <div class="campo">
              <label>Tipo documento</label>
              <select id="f-tipoDoc">
                <option value="CC">CC</option>
                <option value="CE">CE</option>
                <option value="TI">TI</option>
                <option value="PAS">Pasaporte</option>
              </select>
            </div>
            <div class="campo">
              <label>Numero documento *</label>
              <input id="f-numDoc" type="text" placeholder="Numero">
            </div>
            <div class="campo">
              <label>Fecha nacimiento</label>
              <input id="f-fechaNac" type="date">
            </div>
            <div class="campo">
              <label>Nombre *</label>
              <input id="f-nombre" type="text" placeholder="Nombre">
            </div>
            <div class="campo">
              <label>Apellido *</label>
              <input id="f-apellido" type="text" placeholder="Apellido">
            </div>
            <div class="campo">
              <label>Nacionalidad</label>
              <input id="f-nacionalidad" type="text" placeholder="Colombiana">
            </div>
          </div>

          <p style="font-size:11pt;color:var(--color-texto-suave);margin:14px 0">
            Seccion CONTACTO
          </p>
          <div class="grid-3">
            <div class="campo">
              <label>Email</label>
              <input id="f-email" type="email" placeholder="correo@email.com">
            </div>
            <div class="campo">
              <label>Telefono</label>
              <input id="f-telefono" type="text" placeholder="3001234567">
            </div>
            <div class="campo">
              <label>Tipo contacto</label>
              <select id="f-tipoContacto">
                <option value="Personal">Personal</option>
                <option value="Trabajo">Trabajo</option>
                <option value="Otro">Otro</option>
              </select>
            </div>
          </div>

          <p style="font-size:11pt;color:var(--color-texto-suave);margin:14px 0">
            Seccion DIRECCION
          </p>
          <div class="grid-3">
            <div class="campo">
              <label>Calle / Direccion</label>
              <input id="f-calle" type="text" placeholder="Cra 7 # 45-21">
            </div>
            <div class="campo">
              <label>Ciudad</label>
              <input id="f-ciudad" type="text" placeholder="Bogota">
            </div>
            <div class="campo">
              <label>Departamento</label>
              <input id="f-departamento" type="text" placeholder="Cundinamarca">
            </div>
            <div class="campo">
              <label>Pais</label>
              <input id="f-pais" type="text" placeholder="Colombia">
            </div>
            <div class="campo">
              <label>Codigo postal</label>
              <input id="f-codigoPostal" type="text" placeholder="110111">
            </div>
          </div>

          <div class="acciones">
            <button type="button" class="btn btn-secundario" onclick="limpiar()">Limpiar</button>
            <button type="button" class="btn btn-peligro" onclick="eliminar()">Eliminar</button>
            <button type="button" class="btn btn-acento" onclick="actualizar()">Actualizar</button>
            <button type="button" class="btn btn-primario" onclick="guardar()">Guardar</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="../js/datos.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/comunes.js"></script>
<script>
  inicializarLayout();
  let sel = null;
  let proxId = 50;

  function cargarTabla(lista) {
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    if (!lista.length) {
      tb.innerHTML = '<tr><td colspan="9" class="vacio">No hay clientes</td></tr>';
      return;
    }
    lista.forEach(function(c) {
      const tr = document.createElement('tr');
      tr.onclick = function() { seleccionar(c, tr); };
      tr.innerHTML =
        '<td>' + c.idCliente + '</td><td>' + c.tipoDocumento + '</td><td>' + c.numeroDocumento + '</td>' +
        '<td>' + c.nombre + '</td><td>' + c.apellido + '</td><td>' + (c.email||'—') + '</td>' +
        '<td>' + (c.telefono||'—') + '</td><td>' + (c.ciudad||'—') + '</td>' +
        '<td><span class="badge badge-exito">' + (c.estado||'Activo') + '</span></td>';
      tb.appendChild(tr);
    });
  }

  function seleccionar(c, tr) {
    sel = c;
    document.querySelectorAll('#tbody tr').forEach(function(r) { r.classList.remove('seleccionada'); });
    tr.classList.add('seleccionada');
    document.getElementById('f-tipoDoc').value = c.tipoDocumento || 'CC';
    document.getElementById('f-numDoc').value = c.numeroDocumento || '';
    document.getElementById('f-nombre').value = c.nombre || '';
    document.getElementById('f-apellido').value = c.apellido || '';
    document.getElementById('f-fechaNac').value = c.fechaNacimiento || '';
    document.getElementById('f-nacionalidad').value = c.nacionalidad || '';
    document.getElementById('f-email').value = c.email || '';
    document.getElementById('f-telefono').value = c.telefono || '';
    document.getElementById('f-tipoContacto').value = c.tipoContacto || 'Personal';
    document.getElementById('f-calle').value = c.calle || '';
    document.getElementById('f-ciudad').value = c.ciudad || '';
    document.getElementById('f-departamento').value = c.departamento || '';
    document.getElementById('f-pais').value = c.pais || '';
    document.getElementById('f-codigoPostal').value = c.codigoPostal || '';
  }

  function leer() {
    return {
      tipoDocumento: document.getElementById('f-tipoDoc').value,
      numeroDocumento: document.getElementById('f-numDoc').value.trim(),
      nombre: document.getElementById('f-nombre').value.trim(),
      apellido: document.getElementById('f-apellido').value.trim(),
      fechaNacimiento: document.getElementById('f-fechaNac').value,
      nacionalidad: document.getElementById('f-nacionalidad').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      telefono: document.getElementById('f-telefono').value.trim(),
      tipoContacto: document.getElementById('f-tipoContacto').value,
      calle: document.getElementById('f-calle').value.trim(),
      ciudad: document.getElementById('f-ciudad').value.trim(),
      departamento: document.getElementById('f-departamento').value.trim(),
      pais: document.getElementById('f-pais').value.trim(),
      codigoPostal: document.getElementById('f-codigoPostal').value.trim(),
      estado: 'Activo'
    };
  }

  function validar(d) {
    if (d.numeroDocumento.length < 4) return 'Documento obligatorio (min 4 caracteres)';
    if (d.nombre.length < 2) return 'Nombre obligatorio';
    if (d.apellido.length < 2) return 'Apellido obligatorio';
    if (d.email && d.email.indexOf('@') === -1) return 'Email invalido';
    return null;
  }

  function limpiar() {
    sel = null;
    document.getElementById('form-cliente').reset();
    document.querySelectorAll('#tbody tr').forEach(function(r) { r.classList.remove('seleccionada'); });
  }

  function guardar() {
    const d = leer();
    const err = validar(d);
    if (err) { mostrarMensaje('error', err); return; }
    if (CLIENTES.find(function(c) { return c.numeroDocumento === d.numeroDocumento; })) {
      mostrarMensaje('error', 'Ya existe un cliente con ese documento'); return;
    }
    d.idCliente = proxId++;
    d.idPersona = d.idCliente;
    d.nombreCompleto = d.nombre + ' ' + d.apellido;
    d.fechaRegistro = new Date().toISOString().slice(0,10);
    CLIENTES.push(d);
    mostrarMensaje('exito', 'Cliente registrado con ID ' + d.idCliente);
    limpiar();
    cargarTabla(CLIENTES);
  }

  function actualizar() {
    if (!sel) { mostrarMensaje('error', 'Seleccione un cliente de la tabla'); return; }
    const d = leer();
    const err = validar(d);
    if (err) { mostrarMensaje('error', err); return; }
    const idx = CLIENTES.findIndex(function(c) { return c.idCliente === sel.idCliente; });
    d.idCliente = sel.idCliente;
    d.idPersona = sel.idPersona;
    d.nombreCompleto = d.nombre + ' ' + d.apellido;
    d.fechaRegistro = sel.fechaRegistro;
    CLIENTES[idx] = d;
    mostrarMensaje('exito', 'Cliente actualizado');
    limpiar();
    cargarTabla(CLIENTES);
  }

  function eliminar() {
    if (!sel) { mostrarMensaje('error', 'Seleccione un cliente de la tabla'); return; }
    if (!confirm('Eliminar a ' + sel.nombre + ' ' + sel.apellido + '?')) return;
    CLIENTES = CLIENTES.filter(function(c) { return c.idCliente !== sel.idCliente; });
    mostrarMensaje('exito', 'Cliente eliminado');
    limpiar();
    cargarTabla(CLIENTES);
  }

  function buscar() {
    const t = document.getElementById('buscar').value.trim().toLowerCase();
    if (!t) { cargarTabla(CLIENTES); return; }
    cargarTabla(CLIENTES.filter(function(c) {
      return c.numeroDocumento.toLowerCase().includes(t) ||
             c.nombre.toLowerCase().includes(t) ||
             c.apellido.toLowerCase().includes(t);
    }));
  }

  function resetear() {
    document.getElementById('buscar').value = '';
    cargarTabla(CLIENTES);
  }

  document.getElementById('buscar').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') buscar();
  });

  cargarTabla(CLIENTES);
</script>
</body>
</html>
