<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel Diablos Rojos - Clientes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/paginas.css">
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-titulo">HOTEL</div>
        <div class="logo-subtitulo">Diablos Rojos</div>
      </div>
      <nav class="sidebar-menu">
        <a href="dashboard.html" class="menu-item">Inicio</a>
        <a href="clientes.html" class="menu-item">Clientes</a>
        <a href="reservas.html" class="menu-item">Reservas</a>
        <a href="habitaciones.html" class="menu-item">Habitaciones</a>
        <a href="pagos.html" class="menu-item">Pagos</a>
        <div id="menu-separador" class="separador"></div>
        <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
        <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
      </nav>
      <div class="sidebar-footer">
        <button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button>
      </div>
    </aside>

    <div class="contenido-principal">
      <header class="topbar">
        <div class="info-usuario">
          <span id="topbar-nombre" class="saludo"></span>
          <span class="separador-texto">·</span>
          <span id="topbar-rol" class="rol"></span>
        </div>
        <div id="topbar-avatar" class="avatar"></div>
      </header>

      <main class="contenido">

        <div class="page-header">
          <h1 class="titulo">Gestion de Clientes</h1>
          <p class="subtitulo">Registrar, actualizar, buscar y eliminar clientes</p>
        </div>

        <div class="tarjeta busqueda">
          <label for="buscar">Buscar:</label>
          <input id="buscar" type="text" placeholder="Numero de documento, nombre o apellido">
          <button class="btn btn-acento" onclick="buscarClientes()">Buscar</button>
          <button class="btn btn-secundario" onclick="resetearBusqueda()">Mostrar todos</button>
        </div>

        <div id="contenedor-mensaje" class="mensaje oculto"></div>

        <table class="tabla">
          <thead>
            <tr>
              <th>ID</th>
              <th>Tipo Doc.</th>
              <th>Documento</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Email</th>
              <th>Telefono</th>
              <th>Nacionalidad</th>
            </tr>
          </thead>
          <tbody id="tabla-clientes"></tbody>
        </table>

        <div class="tarjeta formulario">
          <h3 class="tarjeta-titulo">Datos del cliente</h3>

          <form id="form-cliente">

            <div class="grid-2">

              <div class="campo">
                <label>Tipo documento</label>
                <select id="f-tipoDoc">
                  <option value="CC">CC</option>
                  <option value="CE">CE</option>
                  <option value="TI">TI</option>
                  <option value="PAS">PAS</option>
                </select>
              </div>

              <div class="campo">
                <label>Numero documento *</label>
                <input id="f-numDoc" type="text" placeholder="Numero de documento">
              </div>

              <div class="campo">
                <label>Nombre *</label>
                <input id="f-nombre" type="text" placeholder="Nombre">
              </div>

              <div class="campo">
                <label>Apellido *</label>
                <input id="f-apellido" type="text" placeholder="Apellido">
              </div>

              <div class="campo">
                <label>Email</label>
                <input id="f-email" type="email" placeholder="correo@email.com">
              </div>

              <div class="campo">
                <label>Telefono</label>
                <input id="f-telefono" type="text" placeholder="3001234567">
              </div>

              <div class="campo">
                <label>Direccion</label>
                <input id="f-direccion" type="text" placeholder="Direccion">
              </div>

              <div class="campo">
                <label>Nacionalidad</label>
                <input id="f-nacionalidad" type="text" placeholder="Colombiana">
              </div>

              <div class="campo">
                <label>Fecha de nacimiento</label>
                <input id="f-fechaNac" type="date">
              </div>

            </div>

            <div class="acciones">
              <button type="button" class="btn btn-secundario" onclick="limpiarFormulario()">Limpiar</button>
              <button type="button" class="btn btn-peligro" onclick="eliminarCliente()">Eliminar</button>
              <button type="button" class="btn btn-acento" onclick="actualizarCliente()">Actualizar</button>
              <button type="button" class="btn btn-primario" onclick="guardarCliente()">Guardar</button>
            </div>

          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="../js/datos.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/comunes.js"></script>
  <script>
    inicializarLayout();

    let clienteSeleccionado = null;
    let proximoId = 100;

    // Carga tabla
    function cargarTabla(lista) {
      const tbody = document.getElementById('tabla-clientes');
      tbody.innerHTML = '';

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="vacio">No hay clientes para mostrar</td></tr>';
        return;
      }

      for (let i = 0; i < lista.length; i++) {
        const c = lista[i];
        const tr = document.createElement('tr');
        tr.onclick = function() { seleccionarCliente(c, tr); };
        tr.innerHTML =
          '<td>' + c.idPersona + '</td>' +
          '<td>' + c.tipoDocumento + '</td>' +
          '<td>' + c.numeroDocumento + '</td>' +
          '<td>' + c.nombre + '</td>' +
          '<td>' + c.apellido + '</td>' +
          '<td>' + (c.email || '—') + '</td>' +
          '<td>' + (c.telefono || '—') + '</td>' +
          '<td>' + (c.nacionalidad || '—') + '</td>';
        tbody.appendChild(tr);
      }
    }

    // Selecciona cliente
    function seleccionarCliente(c, tr) {
      clienteSeleccionado = c;
      // Resalta fila
      const filas = document.querySelectorAll('#tabla-clientes tr');
      filas.forEach(function(f) { f.classList.remove('seleccionada'); });
      tr.classList.add('seleccionada');
      // Llena formulario
      document.getElementById('f-tipoDoc').value = c.tipoDocumento;
      document.getElementById('f-numDoc').value = c.numeroDocumento;
      document.getElementById('f-nombre').value = c.nombre;
      document.getElementById('f-apellido').value = c.apellido;
      document.getElementById('f-email').value = c.email || '';
      document.getElementById('f-telefono').value = c.telefono || '';
      document.getElementById('f-direccion').value = c.direccion || '';
      document.getElementById('f-nacionalidad').value = c.nacionalidad || '';
      document.getElementById('f-fechaNac').value = c.fechaNacimiento || '';
    }

    // Limpia formulario
    function limpiarFormulario() {
      clienteSeleccionado = null;
      document.getElementById('f-tipoDoc').value = 'CC';
      document.getElementById('f-numDoc').value = '';
      document.getElementById('f-nombre').value = '';
      document.getElementById('f-apellido').value = '';
      document.getElementById('f-email').value = '';
      document.getElementById('f-telefono').value = '';
      document.getElementById('f-direccion').value = '';
      document.getElementById('f-nacionalidad').value = '';
      document.getElementById('f-fechaNac').value = '';
      const filas = document.querySelectorAll('#tabla-clientes tr');
      filas.forEach(function(f) { f.classList.remove('seleccionada'); });
    }

    // Lee formulario
    function leerFormulario() {
      return {
        tipoDocumento: document.getElementById('f-tipoDoc').value,
        numeroDocumento: document.getElementById('f-numDoc').value.trim(),
        nombre: document.getElementById('f-nombre').value.trim(),
        apellido: document.getElementById('f-apellido').value.trim(),
        email: document.getElementById('f-email').value.trim(),
        telefono: document.getElementById('f-telefono').value.trim(),
        direccion: document.getElementById('f-direccion').value.trim(),
        nacionalidad: document.getElementById('f-nacionalidad').value.trim(),
        fechaNacimiento: document.getElementById('f-fechaNac').value
      };
    }

    // Valida formulario
    function validar(datos) {
      if (datos.numeroDocumento.length < 4) {
        return 'El documento debe tener al menos 4 caracteres';
      }
      if (datos.nombre.length < 2) {
        return 'El nombre es obligatorio';
      }
      if (datos.apellido.length < 2) {
        return 'El apellido es obligatorio';
      }
      if (datos.email && datos.email.indexOf('@') === -1) {
        return 'El email no es valido';
      }
      return null;
    }

    // Guarda cliente
    function guardarCliente() {
      const datos = leerFormulario();
      const error = validar(datos);
      if (error) {
        mostrarMensaje('error', error);
        return;
      }
      // Verificar duplicados
      for (let i = 0; i < CLIENTES.length; i++) {
        if (CLIENTES[i].numeroDocumento === datos.numeroDocumento) {
          mostrarMensaje('error', 'Ya existe un cliente con ese documento');
          return;
        }
      }
      datos.idPersona = proximoId++;
      CLIENTES.push(datos);
      mostrarMensaje('exito', 'Cliente registrado con ID ' + datos.idPersona);
      limpiarFormulario();
      cargarTabla(CLIENTES);
    }

    // Actualiza cliente
    function actualizarCliente() {
      if (!clienteSeleccionado) {
        mostrarMensaje('error', 'Seleccione un cliente de la tabla');
        return;
      }
      const datos = leerFormulario();
      const error = validar(datos);
      if (error) {
        mostrarMensaje('error', error);
        return;
      }
      // Actualizar en el arreglo
      for (let i = 0; i < CLIENTES.length; i++) {
        if (CLIENTES[i].idPersona === clienteSeleccionado.idPersona) {
          datos.idPersona = clienteSeleccionado.idPersona;
          CLIENTES[i] = datos;
          break;
        }
      }
      mostrarMensaje('exito', 'Cliente actualizado correctamente');
      limpiarFormulario();
      cargarTabla(CLIENTES);
    }

    // Elimina cliente
    function eliminarCliente() {
      if (!clienteSeleccionado) {
        mostrarMensaje('error', 'Seleccione un cliente de la tabla');
        return;
      }
      const c = clienteSeleccionado;
      if (!confirm('Eliminar al cliente ' + c.nombre + ' ' + c.apellido + '?')) {
        return;
      }
      // Eliminar
      for (let i = 0; i < CLIENTES.length; i++) {
        if (CLIENTES[i].idPersona === c.idPersona) {
          CLIENTES.splice(i, 1);
          break;
        }
      }
      mostrarMensaje('exito', 'Cliente eliminado');
      limpiarFormulario();
      cargarTabla(CLIENTES);
    }

    // Busca
    function buscarClientes() {
      const texto = document.getElementById('buscar').value.trim().toLowerCase();
      if (!texto) {
        cargarTabla(CLIENTES);
        return;
      }
      const filtrados = CLIENTES.filter(function(c) {
        return c.numeroDocumento.toLowerCase().indexOf(texto) !== -1 ||
               c.nombre.toLowerCase().indexOf(texto) !== -1 ||
               c.apellido.toLowerCase().indexOf(texto) !== -1;
      });
      cargarTabla(filtrados);
    }

    // Resetea busqueda
    function resetearBusqueda() {
      document.getElementById('buscar').value = '';
      cargarTabla(CLIENTES);
    }

    // Buscar con enter
    document.getElementById('buscar').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') {
        buscarClientes();
      }
    });

    // Carga inicial
    cargarTabla(CLIENTES);
  </script>

</body>
</html>
