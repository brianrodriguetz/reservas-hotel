<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel - Reportes</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/layout.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><div class="logo-titulo">HOTEL</div><div class="logo-subtitulo">Diablos Rojos</div></div>
    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item">Inicio</a>
      <a href="clientes.html" class="menu-item">Clientes</a>
      <a href="reservas.html" class="menu-item">Reservas</a>
      <a href="habitaciones.html" class="menu-item">Habitaciones</a>
      <a href="pagos.html" class="menu-item">Pagos</a>
      <div id="menu-separador" class="separador"></div>
      <a id="menu-empleados" href="empleados.html" class="menu-item">Empleados</a>
      <a id="menu-reportes" href="reportes.html" class="menu-item">Reportes</a>
    </nav>
    <div class="sidebar-footer"><button class="menu-item logout" onclick="cerrarSesion()">Cerrar Sesion</button></div>
  </aside>

  <div class="contenido-principal">
    <header class="topbar">
      <div class="info-usuario">
        <span id="topbar-nombre" class="saludo"></span>
        <span class="separador-texto">·</span>
        <span id="topbar-rol" class="rol"></span>
      </div>
      <div id="topbar-avatar" class="avatar"></div>
    </header>

    <main class="contenido">
      <div class="page-header">
        <h1 class="titulo">Reportes Administrativos</h1>
        <p class="subtitulo">Ocupacion e ingresos consolidados</p>
      </div>

      <h3 class="seccion-titulo">Ocupacion por estado de habitacion</h3>
      <div id="grid-ocup" class="grid-4" style="margin-bottom:26px"></div>

      <h3 class="seccion-titulo">Ingresos por medio de pago</h3>
      <table class="tabla" style="margin-bottom:26px">
        <thead><tr><th>Medio</th><th>Cantidad de pagos</th><th>Total</th></tr></thead>
        <tbody id="tbody-medio"></tbody>
      </table>

      <h3 class="seccion-titulo">Eventos registrados por tipo</h3>
      <table class="tabla">
        <thead><tr><th>Tipo de evento</th><th>Cantidad</th></tr></thead>
        <tbody id="tbody-eventos"></tbody>
      </table>
    </main>
  </div>
</div>

<script src="../js/datos.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/comunes.js"></script>
<script>
  verificarAdmin();
  inicializarLayout();

  function claseColor(e) {
    if (e === 'Disponible') return 'color-exito';
    if (e === 'Ocupada') return 'color-acento';
    if (e === 'En Mantenimiento') return 'color-peligro';
    return 'color-primario';
  }

  // Ocupacion
  const conteo = {};
  HABITACIONES.forEach(function(h) { conteo[h.estado] = (conteo[h.estado]||0)+1; });
  const grid = document.getElementById('grid-ocup');
  Object.keys(conteo).forEach(function(e) {
    const d = document.createElement('div');
    d.className = 'tarjeta';
    d.innerHTML = '<div class="ind-titulo">' + e + '</div><div class="ind-valor ' + claseColor(e) + '">' + conteo[e] + '</div>';
    grid.appendChild(d);
  });

  // Ingresos por medio
  const mapa = {};
  PAGOS.filter(function(p) { return p.estado === 'Aprobado'; }).forEach(function(p) {
    if (!mapa[p.medio]) mapa[p.medio] = { n: 0, total: 0 };
    mapa[p.medio].n++;
    mapa[p.medio].total += p.monto;
  });
  const tbMedio = document.getElementById('tbody-medio');
  Object.keys(mapa).forEach(function(m) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td>' + m + '</td><td>' + mapa[m].n + '</td><td><strong>' + formatearMoneda(mapa[m].total) + '</strong></td>';
    tbMedio.appendChild(tr);
  });

  // Eventos por tipo
  const mapaEv = {};
  RESERVAS.forEach(function(r) {
    (r.eventos||[]).forEach(function(ev) {
      mapaEv[ev.tipo] = (mapaEv[ev.tipo]||0)+1;
    });
  });
  const tbEv = document.getElementById('tbody-eventos');
  Object.keys(mapaEv).forEach(function(t) {
    const tr = document.createElement('tr');
    tr.innerHTML = '<td><strong>' + t + '</strong></td><td>' + mapaEv[t] + '</td>';
    tbEv.appendChild(tr);
  });
</script>
</body>
</html>
