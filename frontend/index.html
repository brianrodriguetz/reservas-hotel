<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Hotel Diablos Rojos - Inicio de Sesion</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/layout.css">
</head>
<body>
  <div class="login-page">
    <aside class="lateral">
      <div class="lateral-contenido">
        <h1 class="lateral-titulo">HOTEL<br>StayFlow</h1>
        <p class="lateral-subtitulo">Sistema de Reservas</p>
        <p class="lateral-mensaje">Bienvenido al sistema de gestion hotelera. Ingrese sus credenciales para continuar.</p>
      </div>
      <div class="lateral-pie">Universidad El Bosque · Bases de Datos I · 2026-1</div>
    </aside>

    <section class="zona-formulario">
      <div class="formulario-contenedor">
        <h2 class="titulo">Iniciar Sesion</h2>
        <p class="subtitulo">Ingrese sus credenciales</p>

        <form id="form-login" class="form-login">
          <div class="campo">
            <label for="usuario">Usuario</label>
            <input id="usuario" type="text" placeholder="Ingrese su usuario">
          </div>
          <div class="campo">
            <label for="password">Contrasena</label>
            <input id="password" type="password" placeholder="Ingrese su contrasena">
          </div>
          <div id="error-login" class="error-banner oculto"></div>
          <button type="submit" class="btn btn-primario btn-grande">Ingresar</button>
          <div class="login-hint">
            Prueba: <strong>admin / admin</strong> &nbsp;|&nbsp; <strong>empleado / empleado</strong>
          </div>
        </form>
      </div>
    </section>
  </div>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
  <script>
    if (obtenerSesion()) window.location.href = 'paginas/dashboard.html';

    document.getElementById('form-login').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('usuario').value.trim();
      const p = document.getElementById('password').value.trim();
      if (u.length < 3 || p.length < 3) {
        document.getElementById('error-login').textContent = 'Ingrese usuario y contrasena';
        document.getElementById('error-login').classList.remove('oculto');
        return;
      }
      const s = login(u, p);
      if (!s) {
        document.getElementById('error-login').textContent = 'Usuario o contrasena incorrectos';
        document.getElementById('error-login').classList.remove('oculto');
        return;
      }
      window.location.href = 'paginas/dashboard.html';
    });
  </script>
</body>
</html>
