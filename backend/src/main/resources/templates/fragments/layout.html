<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- ===== HEAD ===== -->
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' | Hotel Reservas'">Hotel Reservas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>

<body>

<!--
  ===== NAVBAR =====
  Lee session.usuarioSesion (puesto por AuthController).
  Filtra opciones segun el rol:
    - Administrador: ve TODO
    - Recepcionista: NO ve Empleados ni Reembolsos ni Limpieza
    - Personal_Limpieza: solo ve Habitaciones y Limpieza
-->
<nav th:fragment="navbar(activo)" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-building"></i> Hotel Reservas
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">

            <!-- Items de menu -->
            <ul class="navbar-nav me-auto" th:with="u=${session.usuarioSesion}">

                <!-- HABITACIONES: todos los roles -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:classappend="${activo == 'habitaciones'} ? 'active fw-semibold' : ''"
                       th:href="@{/habitaciones}">
                        <i class="bi bi-door-closed"></i> Habitaciones
                    </a>
                </li>

                <!-- LIMPIEZA: solo Admin y Personal_Limpieza -->
                <li class="nav-item"
                    th:if="${u != null and (u.administrador or u.personalLimpieza)}">
                    <a class="nav-link"
                       th:classappend="${activo == 'limpieza'} ? 'active fw-semibold' : ''"
                       th:href="@{/limpieza}">
                        <i class="bi bi-droplet"></i> Limpieza
                    </a>
                </li>

                <!-- CLIENTES: Admin y Recepcionista -->
                <li class="nav-item"
                    th:if="${u != null and (u.administrador or u.recepcionista)}">
                    <a class="nav-link"
                       th:classappend="${activo == 'clientes'} ? 'active fw-semibold' : ''"
                       th:href="@{/clientes}">
                        <i class="bi bi-people"></i> Clientes
                    </a>
                </li>

                <!-- RESERVAS: Admin y Recepcionista -->
                <li class="nav-item"
                    th:if="${u != null and (u.administrador or u.recepcionista)}">
                    <a class="nav-link"
                       th:classappend="${activo == 'reservas'} ? 'active fw-semibold' : ''"
                       th:href="@{/reservas}">
                        <i class="bi bi-calendar-check"></i> Reservas
                    </a>
                </li>

                <!-- EMPLEADOS: solo Admin -->
                <li class="nav-item" th:if="${u != null and u.administrador}">
                    <a class="nav-link"
                       th:classappend="${activo == 'empleados'} ? 'active fw-semibold' : ''"
                       th:href="@{/empleados}">
                        <i class="bi bi-person-badge"></i> Empleados
                    </a>
                </li>

                <!-- REEMBOLSOS: solo Admin -->
                <li class="nav-item" th:if="${u != null and u.administrador}">
                    <a class="nav-link"
                       th:classappend="${activo == 'reembolsos'} ? 'active fw-semibold' : ''"
                       th:href="@{/reembolsos}">
                        <i class="bi bi-cash-coin"></i> Reembolsos
                    </a>
                </li>

                <!-- API DOCS: todos -->
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui.html" target="_blank">
                        <i class="bi bi-code-slash"></i> API
                    </a>
                </li>
            </ul>

           
<!-- Usuario logueado + boton de logout SIEMPRE visible -->
<ul class="navbar-nav align-items-lg-center"
    th:if="${session.usuarioSesion != null}">
    <li class="nav-item text-light me-lg-3 mb-2 mb-lg-0">
        <i class="bi bi-person-circle"></i>
        <span class="small" th:text="${session.usuarioSesion.nombreCompleto}">Usuario</span>
        <span class="badge bg-secondary ms-1" th:text="${session.usuarioSesion.rol}">Rol</span>
    </li>
    <li class="nav-item">
        <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
            <i class="bi bi-box-arrow-right"></i> Cerrar sesión
        </a>
    </li>
</ul>
        </div>
    </div>
</nav>

<!-- ===== FOOTER ===== -->
<footer th:fragment="footer" class="bg-light text-center py-3 mt-5 border-top">
    <div class="container">
        <small class="text-muted">
            Proyecto Final - Bases de Datos 1 &mdash; Universidad El Bosque &mdash; 2026
        </small>
    </div>
</footer>

<!-- ===== SCRIPTS ===== -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</div>

<!-- ===== ALERTAS GLOBALES ===== -->
<div th:fragment="alertas" class="container mt-3">
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

</body>
</html>
