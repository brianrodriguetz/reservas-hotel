<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Habitaciones</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 12px;
            border: 1px solid #ccc;
            text-align: center;
        }

        th {
            background-color: #2c3e50;
            color: white;
        }

    </style>

</head>
<body>

<h1>Lista de Habitaciones</h1>

<table>

    <thead>
        <tr>
            <th>ID</th>
            <th>Código</th>
            <th>Piso</th>
            <th>Estado</th>
            <th>Tipo</th>
        </tr>
    </thead>

    <tbody>

        <tr th:each="habitacion : ${habitaciones}">

            <td th:text="${habitacion.idHabitacion}"></td>

            <td th:text="${habitacion.codigo}"></td>

            <td th:text="${habitacion.piso}"></td>

            <td th:text="${habitacion.estado}"></td>

            <td th:text="${habitacion.idTipo}"></td>

        </tr>

    </tbody>

</table>

</body>
</html>
