<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empleados')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('empleados')}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-person-badge"></i> Empleados</h2>
        <a th:href="@{/empleados/nuevo}" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Nuevo empleado
        </a>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Nombre completo</th>
                        <th>Documento</th>
                        <th>Rol</th>
                        <th>Supervisor</th>
                        <th>Estado</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${empleados.isEmpty()}">
                        <td colspan="8" class="text-center text-muted py-4">
                            <i class="bi bi-inbox"></i> No hay empleados registrados.
                        </td>
                    </tr>
                    <tr th:each="e : ${empleados}">
                        <td th:text="${e.idEmpleado}">1</td>
                        <td><code th:text="${e.usuario}">admin1</code></td>
                        <td><strong th:text="${e.nombreCompleto}">Admin Admin</strong></td>
                        <td th:text="${e.numeroDocumento}">1000001</td>
                        <td>
                            <span class="badge bg-info text-dark"
                                  th:text="${#strings.replace(rolesPorId[e.idRol], '_', ' ')}">Administrador</span>
                        </td>
                        <td>
                            <span th:if="${e.idSupervisor != null}"
                                  th:text="${empleadosPorId[e.idSupervisor]}"
                                  class="small text-muted">supervisor</span>
                            <span th:if="${e.idSupervisor == null}"
                                  class="badge bg-light text-dark border">— Sin supervisor —</span>
                        </td>
                        <td>
                            <span class="badge badge-estado"
                                  th:classappend="'estado-' + ${#strings.toLowerCase(e.estado.name())}"
                                  th:text="${e.estado}">Activo</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/empleados/{id}/editar(id=${e.idEmpleado})}"
                               class="btn btn-sm btn-outline-primary" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/empleados/{id}/eliminar(id=${e.idEmpleado})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar este empleado? Esta acción no se puede deshacer.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted mt-3 small">
        Mostrando <strong th:text="${empleados.size()}">0</strong>
        empleado(s).
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
