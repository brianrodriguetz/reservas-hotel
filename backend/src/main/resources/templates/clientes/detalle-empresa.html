<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle empresa')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('clientes')}"></nav>

<div class="container mt-4">

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/clientes(tab='empresas')}">Clientes</a></li>
            <li class="breadcrumb-item active">Detalle empresa</li>
        </ol>
    </nav>

    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0">
                <i class="bi bi-building"></i>
                <span th:text="${empresa.razonSocial}">Razón social</span>
            </h4>
            <a th:href="@{/clientes/empresas/{id}/editar(id=${empresa.idCliente})}"
               class="btn btn-success btn-sm">
                <i class="bi bi-pencil"></i> Editar
            </a>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID Cliente</dt>
                <dd class="col-sm-9" th:text="${empresa.idCliente}">1</dd>

                <dt class="col-sm-3">NIT</dt>
                <dd class="col-sm-9">
                    <code th:text="${empresa.nit}">900.123.456-7</code>
                </dd>

                <dt class="col-sm-3">Razón social</dt>
                <dd class="col-sm-9" th:text="${empresa.razonSocial}">Acme S.A.S.</dd>

                <dt class="col-sm-3">Representante legal</dt>
                <dd class="col-sm-9" th:text="${empresa.representanteLegal}">Juan Pérez</dd>

                <dt class="col-sm-3">Sector económico</dt>
                <dd class="col-sm-9" th:text="${empresa.sectorEconomico}">Tecnología</dd>

                <dt class="col-sm-3">Estado</dt>
                <dd class="col-sm-9">
                    <span class="badge badge-estado"
                          th:classappend="'estado-' + ${#strings.toLowerCase(empresa.estado.name())}"
                          th:text="${empresa.estado}">Activo</span>
                </dd>

                <dt class="col-sm-3">Fecha de registro</dt>
                <dd class="col-sm-9" th:text="${empresa.fechaRegistro}">2025-01-01</dd>
            </dl>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/clientes(tab='empresas')}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver a la lista
        </a>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
