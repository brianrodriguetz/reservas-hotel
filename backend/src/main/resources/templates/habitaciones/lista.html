<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Habitaciones')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('habitaciones')}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="container mt-4" th:with="u=${session.usuarioSesion}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-door-closed"></i> Habitaciones</h2>
        <a th:if="${u.administrador}" th:href="@{/habitaciones/nueva}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva habitación
        </a>
    </div>

    <!-- Filtros -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <form th:action="@{/habitaciones}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small mb-1">Filtrar por estado</label>
                    <select name="estado" class="form-select">
                        <option value="">— Todos los estados —</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${#strings.replace(e.name(), '_', ' ')}"
                                th:selected="${filtroEstado != null and filtroEstado == e.name()}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small mb-1">Filtrar por tipo</label>
                    <select name="idTipo" class="form-select">
                        <option value="">— Todos los tipos —</option>
                        <option th:each="t : ${tipos}"
                                th:value="${t.idTipo}"
                                th:text="${t.nombre}"
                                th:selected="${filtroIdTipo != null and filtroIdTipo == t.idTipo}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a th:href="@{/habitaciones}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Código</th>
                        <th>Tipo</th>
                        <th>Piso</th>
                        <th>Estado</th>
                        <th th:if="${u.administrador}" class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${habitaciones.isEmpty()}">
                        <td th:colspan="${u.administrador ? 5 : 4}" class="text-center text-muted py-4">
                            <i class="bi bi-inbox"></i> No hay habitaciones que coincidan con los filtros.
                        </td>
                    </tr>
                    <tr th:each="h : ${habitaciones}">
                        <td><strong th:text="${h.codigo}">A101</strong></td>
                        <td th:text="${tiposPorId[h.idTipo]}">Sencilla</td>
                        <td th:text="${h.piso}">1</td>
                        <td>
                            <span class="badge badge-estado"
                                  th:classappend="'estado-' + ${#strings.toLowerCase(h.estado.name())}"
                                  th:text="${#strings.replace(h.estado.name(), '_', ' ')}">Disponible</span>
                        </td>
                        <td th:if="${u.administrador}" class="text-end">
                            <a th:href="@{/habitaciones/{id}/editar(id=${h.idHabitacion})}"
                               class="btn btn-sm btn-outline-primary"
                               title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/habitaciones/{id}/eliminar(id=${h.idHabitacion})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta habitación? Esta acción no se puede deshacer.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted mt-3 small">
        Mostrando <strong th:text="${habitaciones.size()}">0</strong>
        habitacion(es).
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
