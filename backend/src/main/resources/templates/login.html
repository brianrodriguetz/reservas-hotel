<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>

<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5 pt-5">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow">
                <div class="card-body p-4">
                    <div class="text-center mb-4">
                        <i class="bi bi-building display-4 text-primary"></i>
                        <h3 class="mt-2 mb-0">Hotel Reservas</h3>
                        <small class="text-muted">Sistema de gestión interna</small>
                    </div>

                    <div th:if="${mensajeError}" class="alert alert-danger py-2">
                        <i class="bi bi-exclamation-triangle"></i>
                        <span th:text="${mensajeError}"></span>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <input type="hidden" name="next" th:value="${next}">

                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" id="usuario" name="usuario"
                                       class="form-control" required autofocus
                                       placeholder="admin1, recep1, limp1...">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" id="password" name="password"
                                       class="form-control" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Ingresar
                        </button>
                    </form>

                    <hr class="my-3">
                    <small class="text-muted d-block text-center">
                        Demo: usuario y contraseña son iguales.<br>
                        Ej: <code>admin1</code> / <code>admin1</code>
                    </small>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
