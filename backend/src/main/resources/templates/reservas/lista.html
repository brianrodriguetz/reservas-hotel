<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Reservas')}"></head>
<body>

<nav th:replace="~{fragments/layout :: navbar('reservas')}"></nav>
<div th:replace="~{fragments/layout :: alertas}"></div>

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-calendar-check"></i> Reservas</h2>
        <a th:href="@{/reservas/nueva}" class="btn btn-primary">
            <i class="bi bi-plus-lg"></i> Nueva reserva
        </a>
    </div>

    <!-- Filtros -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body">
            <form th:action="@{/reservas}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small mb-1">Filtrar por estado</label>
                    <select name="estado" class="form-select">
                        <option value="">— Todos los estados —</option>
                        <option th:each="e : ${estados}"
                                th:value="${e.name()}"
                                th:text="${#strings.replace(e.name(), '_', ' ')}"
                                th:selected="${filtroEstado != null and filtroEstado == e.name()}"></option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label small mb-1">Filtrar por canal</label>
                    <select name="canal" class="form-select">
                        <option value="">— Todos los canales —</option>
                        <option th:each="c : ${canales}"
                                th:value="${c.name()}"
                                th:text="${c.name()}"
                                th:selected="${filtroCanal != null and filtroCanal == c.name()}"></option>
                    </select>
                </div>
                <div class="col-md-4 d-flex gap-2">
                    <button type="submit" class="btn btn-secondary">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <a th:href="@{/reservas}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i> Limpiar
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Estado</th>
                        <th>Canal</th>
                        <th>Check-in</th>
                        <th>Check-out</th>
                        <th>Noches</th>
                        <th class="text-end">Precio total (COP)</th>
                        <th class="text-end">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${reservas.isEmpty()}">
                        <td colspan="9" class="text-center text-muted py-4">
                            <i class="bi bi-inbox"></i> No hay reservas que coincidan con los filtros.
                        </td>
                    </tr>
                    <tr th:each="r : ${reservas}">
                        <td><strong th:text="'#' + ${r.idReserva}">#1</strong></td>
                        <td>
                            <small th:text="${clientesPorId[r.idCliente] ?: ('Cliente #' + r.idCliente)}">
                                Cliente
                            </small>
                        </td>
                        <td>
                            <span class="badge badge-estado"
                                  th:classappend="'estado-' + ${#strings.toLowerCase(r.estado.name())}"
                                  th:text="${#strings.replace(r.estado.name(), '_', ' ')}">Pendiente</span>
                        </td>
                        <td>
                            <span class="badge badge-estado"
                                  th:classappend="'canal-' + ${#strings.toLowerCase(r.canal.name())}"
                                  th:text="${r.canal}">Telefonica</span>
                        </td>
                        <td>
                            <small th:text="${#temporals.format(r.fechaCheckInPrevista, 'dd/MM/yyyy HH:mm')}">
                                01/01/2026
                            </small>
                        </td>
                        <td>
                            <small th:text="${#temporals.format(r.fechaCheckOutPrevista, 'dd/MM/yyyy HH:mm')}">
                                03/01/2026
                            </small>
                        </td>
                        <td class="text-center" th:text="${r.numeroNoches}">2</td>
                        <td class="text-end">
                            <strong th:text="${#numbers.formatDecimal(r.precioTotal, 0, 'COMMA', 0, 'POINT')}">0</strong>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/reservas/{id}(id=${r.idReserva})}"
                               class="btn btn-sm btn-outline-info" title="Ver detalle">
                                <i class="bi bi-eye"></i>
                            </a>
                            <form th:action="@{/reservas/{id}/eliminar(id=${r.idReserva})}"
                                  method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar la reserva #' + this.dataset.id + '? Esta acción no se puede deshacer.');"
                                  th:attr="data-id=${r.idReserva}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <p class="text-muted mt-3 small">
        Mostrando <strong th:text="${reservas.size()}">0</strong>
        reserva(s).
    </p>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
